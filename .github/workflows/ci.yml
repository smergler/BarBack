name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Live RLS isolation
        env:
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python -m pytest tests/test_rls_isolation.py -v | tee /tmp/rls_output.txt
          python -m pytest tests/test_rls_isolation.py --collect-only -q | grep -q "4 tests collected"
          if grep -q "skipped" /tmp/rls_output.txt; then
            echo "Live RLS isolation tests were skipped — TEST_USER_* / SUPABASE_PROJECT_URL / SUPABASE_PUBLISHABLE_KEY secrets are missing." >&2
            exit 1
          fi

      - name: Offline eval (mock mode, strict)
        run: python -m evals.run_evals --strict

